<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Family invite | Ever Roots</title>
  <link rel="stylesheet" href="/invite.css">
  <script src="/invite.js" defer></script>
</head>
<body>
  <main>
    <img class="logo" src="/logo.png" width="80" height="80" alt="">
    <h1>Ever Roots</h1>
    <p id="message">A place for your family's memories.</p>
    <section id="invite" hidden aria-label="Family invitation">
      <p class="label">Your invite code</p>
      <p id="code"></p>
      <a id="open" class="primary">Open Ever Roots</a>
      <button id="copy" type="button">Copy invite code</button>
      <p class="note">You can also enter this code in the Ever Roots app. Sign in to review and accept the invitation.</p>
      <p id="status" role="status"></p>
    </section>
    <noscript>Open Ever Roots and enter the invite code from your message.</noscript>
  </main>
</body>
</html>
