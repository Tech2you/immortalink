<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Heiro | Family memories</title>
  <link rel="stylesheet" href="/invite.css">
  <script src="/invite.js" defer></script>
</head>
<body>
  <main>
    <img class="logo" src="/logo.png" width="80" height="80" alt="">
    <h1>Heiro</h1>
    <p id="message">A place for your family's memories.</p>
    <section id="invite" hidden aria-label="Family invitation">
      <p class="label">Your invite code</p>
      <p id="code"></p>
      <a id="open" class="primary">Open Heiro</a>
      <button id="copy" type="button">Copy invite code</button>
      <p class="note">You can also enter this code in the Heiro app. Sign in to review and accept the invitation.</p>
      <p id="status" role="status"></p>
    </section>
    <noscript>Open Heiro and enter the invite code from your message.</noscript>
    <footer class="note">
      <a href="/privacy.html">Privacy Policy</a>
      <span aria-hidden="true"> | </span>
      <a href="mailto:linebreakers@outlook.com?subject=Heiro%20support">Contact support</a>
    </footer>
  </main>
</body>
</html>
